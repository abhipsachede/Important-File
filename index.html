<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Story 🎬</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow:hidden;
text-align:center;
}

.screen{
display:none;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
}

.active{display:flex;}

.btn{
padding:12px 20px;
background:#e50914;
color:white;
border:none;
border-radius:6px;
margin-top:15px;
}

.heart{
font-size:30px;
margin:10px;
opacity:0.3;
cursor:pointer;
}

.heart.active{
opacity:1;
transform:scale(1.3);
}

#msg{
margin-top:15px;
color:pink;
}

#final{
max-width:300px;
line-height:1.6;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
<h2>Netflix Story 🎬</h2>
<button class="btn" onclick="go(1)">Play</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<h2>Episode 1 🌌</h2>
<button class="btn" onclick="go(2)">Next</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<h2>Birthday 🎂</h2>
<button class="btn" onclick="go(3)">Continue</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
<h2>5 Secrets ❤️</h2>

<div>
<span class="heart" onclick="tap(this,1)">❤️</span>
<span class="heart" onclick="tap(this,2)">❤️</span>
<span class="heart" onclick="tap(this,3)">❤️</span>
<span class="heart" onclick="tap(this,4)">❤️</span>
<span class="heart" onclick="tap(this,5)">❤️</span>
</div>

<p id="msg"></p>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">
<h2>Final 💌</h2>
<p id="final"></p>
</div>

<script>

let h=0;

/* SCREEN SWITCH (SIMPLE + SAFE) */
function go(n){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("s"+(n+1)).classList.add("active");
}

/* HEARTS */
function tap(el,n){
if(!el.classList.contains("active")){
el.classList.add("active");
h++;

let msg=document.getElementById("msg");

if(n==1) msg.innerText="Secret 1 ✨";
if(n==2) msg.innerText="Secret 2 💙";
if(n==3) msg.innerText="Secret 3 🌌";
if(n==4) msg.innerText="Secret 4 💫";

if(n==5){
msg.innerText="Final unlocking...";
setTimeout(()=>final(),800);
}
}
}

/* FINAL MESSAGE */
function final(){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("s5").classList.add("active");

document.getElementById("final").innerHTML=
`Hiiii Shriyash 💙<br><br>
Happy Birthday ✨<br><br>
You are special in a quiet but deep way 🦋<br><br>
Stay happy always 🌌`;
}

</script>

</body>
</html>
