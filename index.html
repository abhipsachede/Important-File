<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shriyash 🌌</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
margin:0;
font-family:Poppins;
background: radial-gradient(circle at top, #0b0f2a, #000);
color:white;
overflow:hidden;
text-align:center;
}

.screen {
display:none;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
}

.active {display:flex;}

h1 {
font-size:2.5rem;
}

.btn {
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:16px;
margin-top:20px;
cursor:pointer;
}

.heart {
font-size:30px;
margin:10px;
cursor:pointer;
opacity:0.3;
}

.heart.active {
opacity:1;
transform:scale(1.3);
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
<h1>Hii Shriyash 🌌</h1>
<p>A small universe is waiting for you...</p>
<button class="btn" onclick="next(1)">Tap to Enter</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<h1>3... 2... 1 🎉</h1>
<button class="btn" onclick="next(2)">Continue</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<h1>Happiest Birthday 🎂</h1>
<p>Blow the candles in imagination 😭✨</p>
<button class="btn" onclick="blast()">Blow Candle</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
<h1>5 Secrets 💖</h1>
<p>Tap hearts</p>

<div>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
</div>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">
<h1>Final Message 💌</h1>
<p>You are special in a way words can’t explain 🌌</p>
</div>

<script>
let current = 1;
let heartCount = 0;

function next(n){
document.getElementById("s"+n).classList.remove("active");
document.getElementById("s"+(n+1)).classList.add("active");
}

function blast(){
confetti({particleCount:200, spread:100});
next(3);
}

function tap(el){
if(!el.classList.contains("active")){
el.classList.add("active");
heartCount++;
if(heartCount===5){
setTimeout(()=>next(4),1000);
}
}
}
</script>

</body>
</html>
