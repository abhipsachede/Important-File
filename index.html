<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday 🌌</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
margin:0;
font-family:Poppins;
background:black;
color:white;
overflow:hidden;
text-align:center;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:0.15;
animation:move 20s linear infinite;
}

@keyframes move{
0%{transform:translateY(0);}
100%{transform:translateY(-500px);}
}

.screen{
display:none;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
}

.active{display:flex;}

.btn{
padding:12px 20px;
border:none;
border-radius:25px;
background:linear-gradient(45deg,#ff4d6d,#ff9a9e);
color:white;
margin-top:15px;
}

.heart{
font-size:30px;
margin:10px;
opacity:0.3;
cursor:pointer;
}

.heart.active{
opacity:1;
transform:scale(1.3);
}

#titli{
position:fixed;
bottom:20px;
left:20px;
font-size:26px;
animation:fly 3s infinite;
}

@keyframes fly{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}
</style>
</head>

<body>

<div id="titli">🦋 Titli</div>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
<h1>Hii Shriyash 🌌</h1>
<button class="btn" onclick="next(1)">Tap to Enter</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<h1>3...2...1 🎉</h1>
<button class="btn" onclick="next(2)">Continue</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<h1>Happy Birthday 🎂</h1>
<button class="btn" onclick="blast()">Blow Candle</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
<h1>5 Secrets ❤️</h1>

<div>
<span class="heart" onclick="tap(this,1)">❤️</span>
<span class="heart" onclick="tap(this,2)">❤️</span>
<span class="heart" onclick="tap(this,3)">❤️</span>
<span class="heart" onclick="tap(this,4)">❤️</span>
<span class="heart" onclick="tap(this,5)">❤️</span>
</div>

<p id="msg"></p>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">
<h1>Final Message 💌</h1>

<p id="finalText"></p>
</div>

<script>

let hearts=0;

/* SCREEN SWITCH */
function show(n){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("s"+n).classList.add("active");
}

function next(n){ show(n+1); }

function blast(){
confetti({particleCount:200,spread:120});
show(4);
}

/* HEARTS */
function tap(el,n){
if(!el.classList.contains("active")){
el.classList.add("active");
hearts++;

let msg=document.getElementById("msg");

if(n==1) msg.innerText="Secret 1 ✨";
if(n==2) msg.innerText="Secret 2 💙";
if(n==3) msg.innerText="Secret 3 🌌";
if(n==4) msg.innerText="Secret 4 💫";

if(n==5){
msg.innerText="Final unlocked 💌";
setTimeout(()=>showFinal(),1000);
}
}
}

/* FINAL PARA GUARANTEE */
function showFinal(){
document.getElementById("finalText").innerHTML =
`Hiiii Shriyashhhhhhh !!!!! <br><br>
Happpiestttt Birthdayyyyyyy to youu !!!!<br><br>
Hehe I Hope You Achieve Everything You Dream Of And Stay Happy Always 🌌💙<br><br>
Even If I Don’t Say It Loud, You Still Matter In A Very Special Way ✨<br><br>
— A small galaxy made just for you 🦋`;

show(5);
}
</script>

</body>
</html>
