<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Story 🎬</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:black;
color:white;
overflow:hidden;
}

/* background glow */
.bg{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle at top, #1a1f3c, #000);
z-index:0;
}

/* container */
.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
opacity:0;
transform:scale(1.05);
transition:1s;
z-index:2;
padding:20px;
}

.active{
opacity:1;
transform:scale(1);
}

/* netflix title */
.title{
font-size:2rem;
font-weight:900;
letter-spacing:1px;
}

.subtitle{
opacity:0.7;
margin-top:10px;
}

/* button */
.btn{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:5px;
background:#e50914;
color:white;
font-weight:600;
cursor:pointer;
}

/* top bar */
.top{
position:fixed;
top:15px;
left:15px;
font-weight:700;
color:#e50914;
z-index:3;
}

/* hearts */
.heart{
font-size:30px;
margin:10px;
opacity:0.3;
cursor:pointer;
}

.heart.active{
opacity:1;
transform:scale(1.3);
}

/* progress dots */
.dots{
position:fixed;
bottom:20px;
width:100%;
text-align:center;
z-index:3;
}

.dot{
display:inline-block;
width:8px;
height:8px;
background:gray;
border-radius:50%;
margin:4px;
}

.dot.active{
background:#e50914;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="top">NETFLIX STORY</div>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
<div class="title">A Birthday Story 🎬</div>
<div class="subtitle">Tap to start episode 1</div>
<button class="btn" onclick="next()">Play</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<div class="title">Episode 1</div>
<div class="subtitle">A small universe is waiting for you 🌌</div>
<button class="btn" onclick="next()">Next</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<div class="title">Episode 2</div>
<div class="subtitle">3... 2... 1 🎂 Birthday moment</div>
<button class="btn" onclick="next()">Continue</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
<div class="title">Episode 3</div>
<div class="subtitle">Unlock 5 secrets ❤️</div>

<div>
<span class="heart" onclick="tap(this,1)">❤️</span>
<span class="heart" onclick="tap(this,2)">❤️</span>
<span class="heart" onclick="tap(this,3)">❤️</span>
<span class="heart" onclick="tap(this,4)">❤️</span>
<span class="heart" onclick="tap(this,5)">❤️</span>
</div>

<p id="msg"></p>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">
<div class="title">Final Episode 💌</div>
<p id="final"></p>
</div>

<script>

let h=0;

function show(n){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("s"+n).classList.add("active");
}

function next(){
let cur=document.querySelector(".screen.active").id;
let num=parseInt(cur.replace("s",""));
show(num+1);
}

/* hearts */
function tap(el,n){
if(!el.classList.contains("active")){
el.classList.add("active");
h++;

let msg=document.getElementById("msg");

if(n==1) msg.innerText="Secret unlocked...";
if(n==2) msg.innerText="Getting deeper...";
if(n==3) msg.innerText="Something soft...";
if(n==4) msg.innerText="Almost there...";
if(n==5){
msg.innerText="Final unlocking...";
setTimeout(()=>final(),1000);
}
}
}

/* final scene */
function final(){
show(5);

let text=`Hiiii Shriyash 💙
This is not just a birthday.
It is a small story made in a galaxy for you 🌌

I hope you always find peace, growth, and happiness in life.
Even if words are not spoken daily, some feelings stay constant 🦋`;

let i=0;
let el=document.getElementById("final");
el.innerHTML="";

let t=setInterval(()=>{
el.innerHTML+=text[i]=="\n"?"<br>":text[i];
i++;
if(i>=text.length) clearInterval(t);
},25);
}

</script>

</body>
</html>
