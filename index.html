<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shriyash 🌌</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
margin:0;
font-family:Poppins;
background: radial-gradient(circle at top, #050816, #000);
color:white;
overflow:hidden;
text-align:center;
}

.screen {
display:none;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
}

.active {display:flex;}

h1 {
font-size:2.3rem;
animation: float 3s ease-in-out infinite;
}

@keyframes float {
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

.btn {
padding:12px 25px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#ff4d6d,#ff9a9e);
color:white;
font-size:16px;
margin-top:20px;
cursor:pointer;
}

.heart {
font-size:35px;
margin:10px;
cursor:pointer;
opacity:0.2;
transition:0.3s;
}

.heart.active {
opacity:1;
transform:scale(1.4);
filter:drop-shadow(0 0 10px pink);
}

/* candle */
.candle {
width:20px;
height:60px;
background:orange;
margin:20px auto;
border-radius:8px;
position:relative;
}

.flame {
width:20px;
height:25px;
background:gold;
border-radius:50%;
position:absolute;
top:-20px;
left:0;
animation:flicker 0.2s infinite;
}

@keyframes flicker {
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(0.9);}
}

.sparkle {
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
animation:move 3s linear infinite;
}

@keyframes move {
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-200px);opacity:0;}
}
</style>
</head>

<body>

<div class="screen active" id="s1">
<h1>Hii Shriyash 🌌</h1>
<p>A galaxy is waiting for you...</p>
<button class="btn" onclick="next(1)">Tap to Enter</button>
</div>

<div class="screen" id="s2">
<h1>3... 2... 1 🎉</h1>
<button class="btn" onclick="next(2)">Continue</button>
</div>

<div class="screen" id="s3">
<h1>Happiest Birthday 🎂</h1>

<div class="candle">
<div class="flame" id="flame"></div>
</div>

<button class="btn" onclick="blow()">Blow Candle</button>
</div>

<div class="screen" id="s4">
<h1>5 Secrets 💖</h1>
<p>Tap all hearts to unlock</p>

<div>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
</div>

<p id="msg" style="margin-top:20px;"></p>
</div>

<div class="screen" id="s5">
<h1>Final Message 💌</h1>
<p style="max-width:300px;">
You are not just a name in my story… you are the whole sky I look at 🌌💙
</p>
</div>

<script>
let heart=0;

function next(n){
document.getElementById("s"+n).classList.remove("active");
document.getElementById("s"+(n+1)).classList.add("active");
}

function blow(){
document.getElementById("flame").style.display="none";
confetti({particleCount:200,spread:120});
next(3);
}

function tap(el){
if(!el.classList.contains("active")){
el.classList.add("active");
heart++;

let msg=document.getElementById("msg");

if(heart===1) msg.innerText="Secret 1 unlocked...";
if(heart===2) msg.innerText="You are closer...";
if(heart===3) msg.innerText="Something special is building...";
if(heart===4) msg.innerText="Almost there...";
if(heart===5){
msg.innerText="Final secret unlocked 💌";
setTimeout(()=>next(4),1000);
}
}
}

// sparkles
setInterval(()=>{
let s=document.createElement("div");
s.className="sparkle";
s.style.left=Math.random()*100+"vw";
s.style.top="80vh";
document.body.appendChild(s);
setTimeout(()=>s.remove(),3000);
},300);
</script>

</body>
</html>
