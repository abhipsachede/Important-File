<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday 🌌</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
margin:0;
font-family:Poppins;
background:black;
color:white;
overflow:hidden;
text-align:center;
}

/* galaxy stars */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:radial-gradient(white 1px,transparent 1px);
background-size:50px 50px;
animation:move 20s linear infinite;
opacity:0.2;
}

@keyframes move{
0%{transform:translateY(0);}
100%{transform:translateY(-500px);}
}

.screen{
display:none;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
padding:20px;
position:relative;
z-index:2;
}

.active{display:flex;}

h1{font-size:2rem;}

.btn{
padding:12px 20px;
border:none;
border-radius:25px;
background:linear-gradient(45deg,#ff4d6d,#ff9a9e);
color:white;
margin-top:15px;
font-size:16px;
}

.heart{
font-size:30px;
margin:10px;
opacity:0.3;
cursor:pointer;
}

.heart.active{
opacity:1;
transform:scale(1.3);
}

.candle{
width:20px;
height:60px;
background:orange;
margin:20px auto;
border-radius:6px;
position:relative;
}

.flame{
width:20px;
height:20px;
background:gold;
border-radius:50%;
position:absolute;
top:-15px;
left:0;
animation:flicker 0.2s infinite;
}

@keyframes flicker{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(0.9);}
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
<h1>Hii Shriyash 🌌</h1>
<p>A small surprise is waiting...</p>
<button class="btn" onclick="go(1)">Tap to Enter</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<h1>3... 2... 1 🎉</h1>
<button class="btn" onclick="go(2)">Continue</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<h1>Happy Birthday 🎂</h1>
<div class="candle"><div class="flame" id="flame"></div></div>
<button class="btn" onclick="blow()">Blow Candle</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
<h1>5 Secrets ❤️</h1>

<div>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
</div>

<p id="msg"></p>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">
<h1>Final Message 💌</h1>
<p>You are special in a way words can’t explain 🌌💙</p>
</div>

<script>
let step=1;
let hearts=0;

function show(n){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById("s"+n).classList.add("active");
}

function go(n){
show(n+1);
}

function blow(){
document.getElementById("flame").style.display="none";
confetti({particleCount:200,spread:120});
show(4);
}

function tap(el){
if(!el.classList.contains("active")){
el.classList.add("active");
hearts++;

let msg=document.getElementById("msg");

if(hearts==1) msg.innerText="Secret 1 unlocked ❤️";
if(hearts==2) msg.innerText="Secret 2 unlocked ❤️";
if(hearts==3) msg.innerText="Secret 3 unlocked ❤️";
if(hearts==4) msg.innerText="Secret 4 unlocked ❤️";
if(hearts==5){
msg.innerText="Final secret unlocked 💌";
setTimeout(()=>show(5),1000);
}
}
}
</script>

</body>
</html>
