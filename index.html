<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shriyash 🌌</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
overflow:hidden;
font-family:Poppins;
background:#000;
color:white;
}

/* Galaxy background */
canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* screens */
.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
opacity:0;
transform:scale(0.9);
transition:1s;
z-index:2;
padding:20px;
}

.screen.active{
opacity:1;
transform:scale(1);
}

h1{
font-size:2.2rem;
}

/* button */
.btn{
padding:12px 22px;
border-radius:30px;
border:none;
background:linear-gradient(45deg,#ff4d6d,#ff9a9e);
color:white;
margin-top:20px;
}

/* titli */
#titli{
position:fixed;
bottom:20px;
left:20px;
font-size:30px;
animation:float 3s infinite ease-in-out;
z-index:3;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0px);}
}

/* hearts */
.heart{
font-size:30px;
margin:10px;
opacity:0.3;
cursor:pointer;
}

.heart.active{
opacity:1;
transform:scale(1.3);
}

.msg{
margin-top:15px;
font-size:14px;
color:#ffb6c1;
}
</style>
</head>

<body>

<canvas id="galaxy"></canvas>

<div id="titli">🦋 Titli</div>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
<h1>Hii Shriyash 🌌</h1>
<p>A galaxy is waiting for you...</p>
<button class="btn" onclick="next(1)">Tap to Enter</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
<h1>3... 2... 1 🎉</h1>
<button class="btn" onclick="next(2)">Continue</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
<h1>Happiest Birthday 🎂</h1>
<p>Tap to blow candle</p>
<button class="btn" onclick="blast()">Blow Candle</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
<h1>5 Secrets ❤️</h1>

<div>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
<span class="heart" onclick="tap(this)">❤️</span>
</div>

<div class="msg" id="msg"></div>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">
<h1>Final 💌</h1>
<p>You are a whole universe in someone’s sky 🌌💙</p>
</div>

<script>
let heart=0;

function next(n){
function next(n){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("s"+(n+1)).classList.add("active");
}

function blast(){
alert("🎂 Candle blown in imagination!");
next(2);
}

function tap(el){
if(!el.classList.contains("active")){
el.classList.add("active");
heart++;

let m=document.getElementById("msg");

if(heart==1) m.innerText="Secret 1 unlocked...";
if(heart==2) m.innerText="You’re getting closer...";
if(heart==3) m.innerText="Something soft is building...";
if(heart==4) m.innerText="Almost there...";
if(heart==5){
m.innerText="Final secret unlocked 💌";
setTimeout(()=>next(3),1000);
}
}
}

/* galaxy */
const c=document.getElementById("galaxy");
const ctx=c.getContext("2d");
c.width=window.innerWidth;
c.height=window.innerHeight;

let stars=[];
for(let i=0;i<150;i++){
stars.push({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:Math.random()*2
});
}

function draw(){
ctx.clearRect(0,0,c.width,c.height);
ctx.fillStyle="white";

stars.forEach(s=>{
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();

s.y+=0.3;
if(s.y>c.height) s.y=0;
});

requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
